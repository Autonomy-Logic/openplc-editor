name: Security — monthly vulnerability report

# Vulnerability flow, monthly part. Runs on GitHub's servers on the 1st of every
# month to catch new CVEs in dependencies, including in periods with no release.
# It scans the lockfiles (no SBOM: the SBOM is produced once per release by
# security-sbom.yml), has Claude triage any NEW advisory, renders the
# vulnerability report, drops it into security/<YYYY-MM>/ and opens a PR for the
# team to review. Nothing is merged automatically.
#
# Auth: Claude runs on your Claude subscription via CLAUDE_CODE_OAUTH_TOKEN
# (from `claude setup-token`) — no pay-per-token API key. See security/README.md.

on:
  schedule:
    # 06:00 UTC on the 1st of every month. NOTE: GitHub only fires `schedule` from
    # the DEFAULT branch. Until this pipeline is present on the default branch, the
    # monthly run has to be started with the "Run workflow" button below — which is
    # why `workflow_dispatch` is not optional here.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write
  pull-requests: write
  id-token: write   # required by claude-code-action (OIDC)

concurrency:
  group: security-monthly
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # Mapped here because the `secrets` context is NOT allowed in a step-level
    # `if:` — the Claude step gates on `env.CLAUDE_CODE_OAUTH_TOKEN` instead.
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Persisted for the push in "Open Pull Request"; see SECURITY_BOT_TOKEN there.
          token: ${{ secrets.SECURITY_BOT_TOKEN || github.token }}

      - name: Month stamp
        id: m
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # ---- deterministic: vulnerability scan (OSV, honoring the VEX baseline) ----
      - name: Install osv-scanner
        run: |
          OSV_VER=v2.4.0   # pinned; verified against the release SHA256SUMS
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/${OSV_VER}/osv-scanner_linux_amd64" -o /tmp/osv-scanner_linux_amd64
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/${OSV_VER}/osv-scanner_SHA256SUMS" -o /tmp/osv_SHA256SUMS
          ( cd /tmp && grep " osv-scanner_linux_amd64$" osv_SHA256SUMS | sha256sum -c - )
          install -m 0755 /tmp/osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
      - name: Scan
        run: |
          CFG=""; [ -f osv-scanner.toml ] && CFG="--config=osv-scanner.toml"
          set +e
          osv-scanner scan $CFG --recursive --format=json --output=/tmp/osv.json .
          rc=$?
          set -e
          # osv-scanner: 0 = no vulns, 1 = vulns found. Any other code is a scanner
          # failure — do NOT let scan-vulns turn it into an empty (clean) register.
          if [ "$rc" != "0" ] && [ "$rc" != "1" ]; then echo "::error::osv-scanner failed (exit $rc)"; exit 1; fi
          [ -s /tmp/osv.json ] || echo '{"results":[]}' > /tmp/osv.json
          mkdir -p /tmp/out
          node scripts/scan-vulns.mjs /tmp/osv.json /tmp/out/vulnerabilities.csv
          # also an UNfiltered scan, so the report's headline numbers are derived
          # live (raw total vs. suppressed vs. surfacing) instead of hard-coded.
          set +e
          osv-scanner scan --recursive --format=json --output=/tmp/osv-raw.json .
          rc2=$?
          set -e
          if [ "$rc2" != "0" ] && [ "$rc2" != "1" ]; then echo "::error::osv-scanner (raw) failed (exit $rc2)"; exit 1; fi
          [ -s /tmp/osv-raw.json ] || echo '{"results":[]}' > /tmp/osv-raw.json

      # ---- judgment: Claude triages the delta + updates the report data ----
      # Runs on YOUR subscription (no API key). Skipped gracefully if the token
      # isn't configured yet — the deterministic report still builds below.
      - name: Claude — triage new advisories & update report data
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            You are updating this repository's monthly security report DATA only.
            Input: the fresh scan at /tmp/osv.json.
            For every advisory present in /tmp/osv.json that is NOT already listed
            in osv-scanner.toml, read the source code and decide reachability
            (is the vulnerable function called? is its input attacker-controlled?).
            Then:
             (a) if NOT exploitable, add an [[IgnoredVulns]] entry to osv-scanner.toml
                 with a CISA VEX reason and an ignoreUntil date ~3 months out;
             (b) if exploitable, add/refresh the corresponding entry in
                 security/report-config.json (affected[]) with the fix version;
             (c) keep the counts and the notAffected[]/mitigated[] arrays in
                 security/report-config.json consistent with the scan.
            When you add an [[IgnoredVulns]] entry, prefix its `reason` with
            "AI-TRIAGED [unreviewed]: " and keep the CISA VEX justification after
            it. This step has authority to write security suppressions and the only
            control is human review of the PR diff, so a reviewer must be able to
            tell automated triage from human triage at a glance. Never edit or
            remove an existing entry whose reason lacks that prefix.

            EDIT ONLY these two files: osv-scanner.toml and
            security/report-config.json. Do not touch anything else. If there are
            no new advisories, make no changes.

      # A partial or interrupted edit by the step above must not reach the
      # renderer: a truncated report-config.json is a parse error (loud), but a
      # truncated osv-scanner.toml silently DROPS suppressions, and a
      # half-written one can silently add them. Deliberately NO continue-on-error.
      - name: Validate the triage edits
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("security/report-config.json","utf8"))' \
            || { echo "::error::security/report-config.json is not valid JSON after the triage step"; exit 1; }
          python3 - <<'PY'
          import sys, tomllib
          with open("osv-scanner.toml", "rb") as f:
              try:
                  cfg = tomllib.load(f)
              except tomllib.TOMLDecodeError as e:
                  sys.exit(f"::error::osv-scanner.toml is not valid TOML after the triage step: {e}")
          entries = cfg.get("IgnoredVulns", [])
          missing = [e for e in entries if not e.get("id") or not e.get("reason") or not e.get("ignoreUntil")]
          if missing:
              sys.exit(f"::error::{len(missing)} [[IgnoredVulns]] entr(ies) lack id/reason/ignoreUntil")
          ai = sum(1 for e in entries if "AI-TRIAGED" in str(e.get("reason", "")))
          print(f"osv-scanner.toml OK: {len(entries)} suppressions ({ai} AI-triaged, pending human review).")
          PY
          # The suppression baseline should only ever grow through review. A drop
          # means the triage step rewrote rather than appended.
          # `grep -c` exits 1 on zero matches and still prints "0", so `|| true`
          # (not `|| echo 0`, which would append a second line).
          BEFORE=$(git show "HEAD:osv-scanner.toml" 2>/dev/null | grep -c '^\[\[IgnoredVulns\]\]' || true)
          AFTER=$(grep -c '^\[\[IgnoredVulns\]\]' osv-scanner.toml || true)
          BEFORE=${BEFORE:-0}; AFTER=${AFTER:-0}
          echo "Suppressions: $BEFORE -> $AFTER"
          if [ "$AFTER" -lt "$BEFORE" ]; then
            echo "::error::the triage step REMOVED $((BEFORE - AFTER)) suppression(s) from osv-scanner.toml — refusing to build a report from it"; exit 1
          fi

      # ---- deterministic: render the report from the (possibly updated) data ----
      - name: Build report (md + html)
        id: report
        run: |
          node scripts/build-report.mjs \
            --config security/report-config.json \
            --osv-raw /tmp/osv-raw.json \
            --osv-delta /tmp/osv.json \
            --out "security/${{ steps.m.outputs.month }}" \
            --date "${{ steps.m.outputs.month }}"

      # Chrome preinstalled on the runner image: this repository only allows
      # GitHub-owned and verified third-party actions.
      - name: Assemble dated folder
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          [ -n "$CHROME" ] || { echo "::error::no Chrome binary on the runner"; exit 1; }
          MONTH="${{ steps.m.outputs.month }}"
          DIR="security/$MONTH"
          cp /tmp/out/vulnerabilities.csv "$DIR/"
          # The report path comes from build-report itself. Globbing the directory
          # for '*Security-Report.html' produced a two-word broken path the moment a
          # second .html landed there.
          REPORT="${{ steps.report.outputs.html }}"
          [ -f "$REPORT" ] || { echo "::error::report HTML not found at '$REPORT'"; exit 1; }
          # --no-sandbox / --disable-dev-shm-usage: Chrome's zygote sandbox aborts
          # (SIGABRT) on GitHub runners; required for headless Chrome in CI.
          # --disable-javascript: the report HTML is a static document written from
          # report-config.json (AI-authored) — no JS should ever run while rendering
          # it with local file:// access. Defense-in-depth on top of the HTML escaping.
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --disable-javascript --disable-gpu --no-pdf-header-footer \
            --run-all-compositor-stages-before-draw --virtual-time-budget=5000 \
            --print-to-pdf="${REPORT%.html}.pdf" "file://$PWD/$REPORT"
          # A plain text pointer, not a symlink: `ln -s` commits a symlink that a
          # Windows checkout (the team develops on Windows) materializes as a file
          # containing the target path, which is worse than just committing the text.
          printf '%s\n' "$MONTH" > security/LATEST

      # ---- delivery: open the PR for review ----
      # Plain git + gh instead of a third-party PR action (not on this
      # repository's allowed-actions list). Re-runs in the same month force-push
      # the branch, which updates the PR already open for it.
      - name: Open Pull Request
        env:
          # A PR opened with the default GITHUB_TOKEN does NOT trigger other
          # workflows. Set SECURITY_BOT_TOKEN (GitHub App token or fine-grained
          # PAT with contents+PR write) to make checks run on the monthly PR.
          GH_TOKEN: ${{ secrets.SECURITY_BOT_TOKEN || github.token }}
          MONTH: ${{ steps.m.outputs.month }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          BRANCH="chore/security-$MONTH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add security osv-scanner.toml
          if git diff --cached --quiet; then echo "No changes to propose."; exit 0; fi
          git commit -q -m "chore(security): vulnerability report $MONTH"
          # Pushes with the token the checkout step persisted (same as GH_TOKEN).
          git push -q --force origin "HEAD:refs/heads/$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')" ]; then
            echo "PR for $BRANCH already open; branch updated."; exit 0
          fi
          cat > /tmp/pr-body.md <<EOF
          Automated monthly vulnerability snapshot for **${REPO_NAME}** — \`security/${MONTH}/\`.

          - No SBOM here: it is generated once per release by \`security-sbom.yml\` and archived on \`security-archive\`.
          - Dependencies scanned against OSV (same source as Dependabot), honoring \`osv-scanner.toml\` (the VEX baseline).
          - New advisories (if any) were triaged by Claude and reflected in \`report-config.json\` / \`osv-scanner.toml\` — **review those diffs**. Suppressions written by the automated step carry \`AI-TRIAGED [unreviewed]\` in their \`reason\`; clearing that marker is the reviewer's acknowledgement.
          - Any advisory the triage did **not** account for is listed in section **4a — Untriaged in This Scan** of the report, and the report says so in its executive summary.

          Nothing is merged automatically. Approve to archive this month's snapshot.
          EOF
          gh pr create --base main --head "$BRANCH" \
            --title "chore(security): monthly vulnerability report — $MONTH" --body-file /tmp/pr-body.md
