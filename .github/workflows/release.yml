name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 4.1.2)'
        required: false
        default: ''

env:
  NODE_VERSION: '22.x'

# Only create-release writes to the repository, and it asks for that itself.
permissions:
  contents: read

jobs:
  # =============================================================================
  # Release gate - a stable tag needs a published release candidate first
  # =============================================================================
  # Every installed editor from 4.1.0 on auto-updates from the latest stable
  # release (DOPE-486), so a stable tag reaches the whole macOS and Linux fleet.
  # It must have been through a published vX.Y.Z-rc.N first. Those rc releases
  # are kept: stable clients ignore prereleases, and this gate reads them.
  # Runs before the builds so a missing rc fails in seconds, not after them.
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require a published release candidate for a stable tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "Prerelease tag ${GITHUB_REF_NAME}: no release candidate required."
            exit 0
          fi
          COUNT=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,isDraft,isPrerelease \
            --jq "[.[] | select(.isPrerelease and (.isDraft | not) and (.tagName | startswith(\"v${VERSION}-rc.\")))] | length")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No published release candidate v${VERSION}-rc.N. Release and test one before tagging v${VERSION}."
            exit 1
          fi
          echo "Found ${COUNT} published release candidate(s) for v${VERSION}."

  # =============================================================================
  # macOS Build - Builds both x64 and arm64
  # =============================================================================
  build-macos:
    needs: release-gate
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: binaries-macOS-${{ hashFiles('binary-versions.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Download binaries for x64
        run: npx ts-node scripts/download-binaries.ts --arch x64

      - name: Get version and build date
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          BUILD_DATE=$(date +%Y-%m-%d)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (Build date: $BUILD_DATE)"

      - name: Update package.json version
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version
          cd release/app && npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Import Code Signing Certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Clean up
          rm $RUNNER_TEMP/certificate.p12

      - name: Build and package
        env:
          CI: 'true'
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create branded DMG files
        run: |
          chmod +x ./create_dmg.sh
          ./create_dmg.sh "${{ steps.version.outputs.version }}"

      - name: Upload macOS x64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-dmg
          path: OpenPLC_Editor_${{ steps.version.outputs.version }}.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Upload macOS ARM64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: OpenPLC_Editor_${{ steps.version.outputs.version }}-ARM.dmg
          retention-days: 30
          if-no-files-found: error

      # What installed editors update from: the notarized .app zipped per
      # arch, its blockmap for differential downloads, and the metadata that
      # lists both archs. The DMGs above are for first installs only.
      - name: Upload macOS update files
        uses: actions/upload-artifact@v4
        with:
          name: macos-update
          path: |
            release/build/latest-mac.yml
            release/build/OpenPLC-Editor-${{ steps.version.outputs.version }}-arm64.zip
            release/build/OpenPLC-Editor-${{ steps.version.outputs.version }}-arm64.zip.blockmap
            release/build/OpenPLC-Editor-${{ steps.version.outputs.version }}-x64.zip
            release/build/OpenPLC-Editor-${{ steps.version.outputs.version }}-x64.zip.blockmap
          retention-days: 30
          if-no-files-found: error

  # =============================================================================
  # Windows Build - x64
  # =============================================================================
  build-windows-x64:
    # Pinned alongside build-windows-arm64 (see the comment block on
    # that job for the full story).  The Win-x64 build succeeded on
    # `windows-latest = windows-2025-vs2026` for v4.2.2, but the
    # underlying VS 2026 maxBuffer issue could trip x64 too on a
    # future runner rotation.  Pinning both today is cheaper than
    # debugging the same class of failure again in a few months.
    needs: release-gate
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: binaries-Windows-x64-${{ hashFiles('binary-versions.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Download binaries for x64
        run: npx ts-node scripts/download-binaries.ts --arch x64

      - name: Get version and build date
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          BUILD_DATE=$(date +%Y-%m-%d)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (Build date: $BUILD_DATE)"

      - name: Update package.json version
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version
          cd release/app && npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build and package
        env:
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
        run: npm run package

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-exe
          path: release/build/*.exe
          retention-days: 30
          if-no-files-found: error

  # =============================================================================
  # Windows Build - ARM64
  # =============================================================================
  build-windows-arm64:
    # Pin to windows-2022 (the only label that still gets VS 2022):
    # `windows-latest` rotated to the VS 2026 variant on Jun 8 and
    # broke this job. v4.2.1 (Jun 7) ran on `Image: windows-2025`
    # which AT THE TIME used the `win25` runner-images branch with
    # VS 2022.  GitHub has since re-bound the `windows-2025` label
    # to the `win25-vs2026` branch (VS 2026) — verified by an
    # explicit `runs-on: windows-2025` resolving to `Image:
    # windows-2025-vs2026` and failing identically.  So `windows-
    # 2025` is no longer a working label for our purposes;
    # `windows-2022` (Windows Server 2022 + VS 2022) is the only
    # remaining GitHub-hosted image that ships VS 2022.
    #
    # The failure mode: VS 2026's `vswhere`/PowerShell enumeration
    # emits enough metadata that node-gyp's child_process stdout
    # read overflows with `RangeError
    # [ERR_CHILD_PROCESS_STDIO_MAXBUFFER]` — node-gyp then reports
    # "Could not find any Visual Studio installation to use" and
    # the ARM64 cross-compile of `@serialport/bindings-cpp` fails.
    # When node-gyp / electron-builder ship a fix we can revert to
    # `windows-latest`.
    needs: release-gate
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: binaries-Windows-arm64-${{ hashFiles('binary-versions.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Download binaries for ARM64
        run: npx ts-node scripts/download-binaries.ts --arch arm64

      - name: Get version and build date
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          BUILD_DATE=$(date +%Y-%m-%d)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (Build date: $BUILD_DATE)"

      - name: Update package.json version
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version
          cd release/app && npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build application
        env:
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
        run: npm run build

      - name: Package for ARM64
        run: npx electron-builder --win --arm64 --publish never
        env:
          CI: 'true'

      - name: Rename artifact for ARM64
        shell: pwsh
        run: |
          $exeFile = Get-ChildItem -Path "release/build" -Filter "*.exe" | Select-Object -First 1
          if ($exeFile) {
            $newName = $exeFile.Name -replace '\.exe$', '-ARM64.exe'
            Rename-Item -Path $exeFile.FullName -NewName $newName
            Write-Host "Renamed to: $newName"
          }

      - name: Upload Windows ARM64 installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-exe
          path: release/build/*-ARM64.exe
          retention-days: 30
          if-no-files-found: error

  # =============================================================================
  # Linux Build - x64
  # =============================================================================
  build-linux-x64:
    needs: release-gate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: binaries-Linux-x64-${{ hashFiles('binary-versions.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Get version and build date
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          BUILD_DATE=$(date +%Y-%m-%d)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (Build date: $BUILD_DATE)"

      - name: Update package.json version
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version
          cd release/app && npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build and package
        env:
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
        run: npm run package

      # The AppImage name carries no version on purpose: electron-updater
      # replaces a version-less AppImage in place, so the user's shortcuts keep
      # pointing at it across updates.
      - name: Upload Linux x64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-appimage
          path: |
            release/build/OpenPLC-Editor.AppImage
            release/build/latest-linux.yml
          retention-days: 30
          if-no-files-found: error

  # =============================================================================
  # Linux Build - ARM64
  # =============================================================================
  build-linux-arm64:
    needs: release-gate
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: binaries-Linux-arm64-${{ hashFiles('binary-versions.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Get version and build date
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          BUILD_DATE=$(date +%Y-%m-%d)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (Build date: $BUILD_DATE)"

      - name: Update package.json version
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version
          cd release/app && npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build application
        env:
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
        run: npm run build

      # Named at build time, not renamed afterwards: latest-linux-arm64.yml
      # records the file name electron-builder wrote, so a rename after the
      # fact would point every ARM64 editor at a file that does not exist.
      - name: Package for ARM64
        run: npx electron-builder --linux AppImage --arm64 --publish never -c.linux.artifactName='OpenPLC-Editor-ARM64.${ext}'
        env:
          CI: 'true'

      # The metadata travels with its AppImage so they are missing together or
      # not at all; verify-release-assets.js refuses one without the other.
      - name: Upload Linux ARM64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-appimage
          path: |
            release/build/OpenPLC-Editor-ARM64.AppImage
            release/build/latest-linux-arm64.yml
          retention-days: 30
          if-no-files-found: warn  # Warn only since ARM64 binaries may be missing

  # =============================================================================
  # Create GitHub Release
  # =============================================================================
  # Publishing reaches every installed macOS and Linux editor (DOPE-486), so
  # this job waits for approval in the `release` environment, verifies every
  # file before anything is uploaded, and publishes stable releases to a 1%
  # stage first. Raise the stage with release-stage.yml. See docs/auto-update.md.
  create-release:
    needs: [build-macos, build-windows-x64, build-windows-arm64, build-linux-x64, build-linux-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Only the YAML parser, not the whole repository.
      - name: Install the release verifier's dependency
        run: npm install --prefix "$RUNNER_TEMP/verifier" --no-audit --no-fund yaml@2.8.1

      - name: Get version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name "*" | head -50

      - name: Determine if prerelease
        id: prerelease
        run: |
          if [[ "${{ github.ref }}" == *"beta"* ]] || [[ "${{ github.ref }}" == *"alpha"* ]] || [[ "${{ github.ref }}" == *"rc"* ]]; then
            echo "flag=--prerelease" >> $GITHUB_OUTPUT
            echo "staging=" >> $GITHUB_OUTPUT
          else
            echo "flag=" >> $GITHUB_OUTPUT
            echo "staging=--staging 1" >> $GITHUB_OUTPUT
          fi

      # One flat directory holding exactly what will be uploaded. Windows
      # contributes its installers only: its latest.yml is never published,
      # because Windows clients up to now have no publisherName and would
      # install whatever it pointed to without checking a signature.
      - name: Assemble release assets
        run: |
          mkdir -p release-assets
          cp artifacts/macos-x64-dmg/*.dmg release-assets/
          cp artifacts/macos-arm64-dmg/*.dmg release-assets/
          cp artifacts/macos-update/* release-assets/
          cp artifacts/windows-x64-exe/*.exe release-assets/
          cp artifacts/windows-arm64-exe/*.exe release-assets/
          cp artifacts/linux-x64-appimage/* release-assets/
          if [ -d artifacts/linux-arm64-appimage ]; then cp artifacts/linux-arm64-appimage/* release-assets/; fi
          ls -la release-assets

      - name: Verify release assets
        env:
          NODE_PATH: ${{ runner.temp }}/verifier/node_modules
        run: node scripts/verify-release-assets.js verify release-assets ${{ steps.prerelease.outputs.staging }}

      # Created as a draft so no client ever sees the release before its
      # update metadata is attached, then published in one step.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "OpenPLC Editor v${{ steps.version.outputs.version }}" \
            --generate-notes \
            ${{ steps.prerelease.outputs.flag }} \
            release-assets/*
          gh release edit "${{ github.ref_name }}" --draft=false
