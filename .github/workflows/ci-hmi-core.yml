name: CI - HMI Core

on:
  workflow_dispatch:
  # Called from `ci.yml` on pull requests to main and development; can also be started by hand.
  workflow_call:

jobs:
  hmi-core:
    name: HMI Core, widget library and unit generator (gcc, clang, WebAssembly, sanitizers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # ts-node runs the font build step and @yowasp/clang builds the WebAssembly target.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Golden scenes on gcc, clang and WebAssembly with -Wall -Wextra -Werror, unit tests with every font table,
      # and the fuzzer under AddressSanitizer and UndefinedBehaviorSanitizer.
      - name: Test the HMI core
        run: node tests/hmi-core/run.mjs --cc "gcc clang" --sanitize --fuzz 100000

      # The pinned STruC++ compiles the StandardWidgets library and the test screens.
      - name: Install STruC++
        run: npm run setup:strucpp

      # Headless frames of the widget library on gcc and clang against golden.txt.
      - name: Test the HMI widget library
        run: node tests/hmi-lib/run.mjs --cc "gcc clang"

      # The generated HMI unit of a sample project, run by a C host through hmi_unit.h, against golden.txt.
      - name: Test the HMI unit generator
        run: node tests/hmi-unit/run.mjs --cc "gcc clang"
