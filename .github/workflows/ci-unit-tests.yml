name: CI - Unit Tests

on:
  workflow_dispatch:
  # Called from `ci.yml` on every pull request.
  workflow_call:
    inputs:
      skip:
        description: Skip the steps because the same check already passed locally (the job still ends green).
        type: boolean
        default: false

jobs:
  unit-tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    # Required check on `development` — a red suite blocks the merge.
    # Skipped per step, not with a job `if:`, so the job still ends green under
    # its check name, like the build and lint checks.
    steps:
      - name: Skipped, already passed locally
        if: ${{ inputs.skip }}
        run: echo "Skipped because the ci-passed-locally label was on this pull request into development when it was opened, and this check ran locally on the demand head."

      - name: Checkout repository
        if: ${{ !inputs.skip }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ !inputs.skip }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: ${{ !inputs.skip }}
        run: npm ci --ignore-scripts

      # --ignore-scripts skips the postinstall, so strucpp (a GitHub-release
      # package, not an npm dep) is never fetched — yet the TS sources import
      # `strucpp/libs/iec-types.json` and its runtime headers. Install just
      # strucpp (no native rebuild) so the suites
      # can load and the coverage gate actually runs.
      - name: Install strucpp
        if: ${{ !inputs.skip }}
        run: npm run setup:strucpp

      - name: Run tests with coverage
        if: ${{ !inputs.skip }}
        run: npx jest --config jest.config.json --collectCoverage --ci

      - name: Upload coverage report
        if: ${{ !inputs.skip }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
