            exit 1
          fi
          mkdir -p out
          mv "${INSTALLERS[0]}" "out/OpenPLC.Editor-${VERSION}-ARM64.AppImage"
          node -e "$DIGEST_JS" built-linux-arm64.json out/*

      - name: Read the fuses of the built executable
        run: node tooling/scripts/release/read-fuses.mjs tree/release/build/linux-arm64-unpacked/open-plc-editor

      - name: Scan the unpacked output for trust-anchor literals
        run: node tooling/scripts/release/scan-trust-literals.mjs --trusted-keys tooling/src/backend/shared/utils/vpp/trusted-keys.ts tree/release/build/linux-arm64-unpacked

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: installers-linux-arm64
          path: out/
          retention-days: 7
          if-no-files-found: error

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-arm64
          path: built-linux-arm64.json
          retention-days: 30
          if-no-files-found: error

  packaged-checks:
    needs: [resolve, build-macos, build-windows-x64, build-linux-x64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: mac
            artifact: installers-macos
            asset_prefix: OpenPLC_Editor_
            asset_suffix: '-ARM.dmg'
          - runner: windows-2022
            platform: win
            artifact: installers-windows-x64
            asset_prefix: OpenPLC.Editor_
            asset_suffix: '.exe'
          - runner: ubuntu-22.04
            platform: linux
            artifact: installers-linux-x64
            asset_prefix: OpenPLC.Editor-
            asset_suffix: '.AppImage'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      ASSET: ${{ matrix.asset_prefix }}${{ needs.resolve.outputs.version }}${{ matrix.asset_suffix }}
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Checkout the positive-control package and the trusted keys of the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: tree
          sparse-checkout: |
            src/backend/editor/package-trust/__tests__/fixtures/com.openplc.fx3u-compatible-2.1.0.vpp
            src/backend/shared/utils/vpp/trusted-keys.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the rebuilt installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installers

      - name: Run the packaged checks on the rebuilt installer
        run: |
          mkdir -p reports
          if [ "$PLATFORM" = linux ]; then
            chmod +x "installers/$ASSET"
            set -- xvfb-run -a
          fi
          "$@" node tooling/scripts/release/packaged-checks.mjs --platform "$PLATFORM" \
            --installer "installers/$ASSET" --version "$VERSION" \
            --positive-control tree/src/backend/editor/package-trust/__tests__/fixtures/com.openplc.fx3u-compatible-2.1.0.vpp \
            --trusted-keys tree/src/backend/shared/utils/vpp/trusted-keys.ts \
            --report "reports/packaged-checks-$PLATFORM.json"

      - name: Download the original installer of the published release
        id: original
        if: ${{ !cancelled() && inputs.negative_controls }}
        run: |
          mkdir -p original
          curl -fsSL -o "original/$ASSET" "https://github.com/Autonomy-Logic/openplc-editor/releases/download/v$VERSION/$ASSET"

      - name: Run the packaged checks on the original installer as a negative control
        if: ${{ !cancelled() && inputs.negative_controls && steps.original.outcome == 'success' }}
        run: |
          mkdir -p reports
          if [ "$PLATFORM" = linux ]; then
            chmod +x "original/$ASSET"
            set -- xvfb-run -a
          fi
          "$@" node tooling/scripts/release/packaged-checks.mjs --platform "$PLATFORM" \
            --installer "original/$ASSET" --version "$VERSION" \
            --positive-control tree/src/backend/editor/package-trust/__tests__/fixtures/com.openplc.fx3u-compatible-2.1.0.vpp \
            --trusted-keys tree/src/backend/shared/utils/vpp/trusted-keys.ts \
            --report "reports/negative-control-$PLATFORM.json" --negative-control

      - name: Upload the reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: packaged-checks-${{ matrix.platform }}
          path: reports/
          retention-days: 30

  publish:
    if: ${{ inputs.mode == 'rebuild' }}
    needs:
      - resolve
      - build-macos
      - build-windows-x64
      - build-windows-arm64
      - build-linux-x64
      - build-linux-arm64
      - packaged-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the rebuild manifest
        uses: actions/download-artifact@v4
        with:
          name: rebuild-manifest
          path: manifest

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: upload

      - name: Download the build digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests

      - name: Merge the build digests
        run: jq -s 'add' digests/built-*.json > built.json && cat built.json

      - name: Negative control, a set with update metadata fails the upload set check
        if: ${{ inputs.negative_controls }}
        run: |
          rm -rf negative-control
          cp -R upload negative-control
          : > negative-control/latest.yml
          if node tooling/scripts/release/check-upload-set.mjs --version "$VERSION" negative-control; then
            echo "::error::The upload set check passed a set holding latest.yml"
            exit 1
          fi

      - name: Check the upload set
        run: node tooling/scripts/release/check-upload-set.mjs --version "$VERSION" upload

      - name: Replace the six installers
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[] | "\(.id)\t\(.name)"' > current-assets.tsv
          for FILE in upload/*; do
            NAME=$(basename "$FILE")
            ASSET_ID=$(awk -F '\t' -v name="$NAME" '$2 == name { print $1 }' current-assets.tsv)
            if [ -n "$ASSET_ID" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
            fi
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$FILE" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$NAME" > /dev/null
            echo "Replaced $NAME"
          done

      - name: Check the release digests
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.assets' > release-assets.json
          node tooling/scripts/release/release-digests.mjs after --version "$VERSION" --assets release-assets.json --built built.json --original manifest/original.json

      - name: Record the rebuild in the release notes
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.body // ""' > current-body.md
          node tooling/scripts/release/release-notes.mjs --body current-body.md --date "$(date -u +%Y-%m-%d)" --commit "$SHA" --original manifest/original.json --built built.json > new-body.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F body=@new-body.md > /dev/null

  verify:
    if: ${{ inputs.mode == 'verify' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require a run to verify
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            echo "::error::The run_id input is required in verify mode"
            exit 1
          fi

      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the rebuild manifest of the run
        uses: actions/download-artifact@v4
        with:
          name: rebuild-manifest
          path: manifest
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download the build digests of the run
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check the release digests
        env:
          RELEASE: ${{ inputs.release }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ "$(jq -r .release manifest/manifest.json)" != "$RELEASE" ]; then
            echo "::error::Run $RUN_ID rebuilt $(jq -r .release manifest/manifest.json), not $RELEASE"
            exit 1
          fi
          VERSION=$(jq -r .version manifest/manifest.json)
          RELEASE_ID=$(jq -r .release_id manifest/manifest.json)
          jq -s 'add' digests/built-*.json > built.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.assets' > release-assets.json
          node tooling/scripts/release/release-digests.mjs after --version "$VERSION" --assets release-assets.json --built built.json --original manifest/original.json

  seed-audit:
    if: ${{ inputs.mode == 'seed-audit' }}
    runs-on: ubuntu-latest
    environment: release-trust
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Require a run to audit
        run: |
          if [ -z "$RUN_ID" ]; then
            echo "::error::The run_id input is required in seed-audit mode"
            exit 1
          fi

      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the rebuild manifest of the run
        uses: actions/download-artifact@v4
        with:
          name: rebuild-manifest
          path: ${{ runner.temp }}/audit/manifest
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download the remaining artifacts of the run
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/audit/artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Read the manifest
        id: manifest
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          MANIFEST="$RUNNER_TEMP/audit/manifest/manifest.json"
          if [ "$(jq -r .release "$MANIFEST")" != "$RELEASE" ]; then
            echo "::error::Run $RUN_ID rebuilt $(jq -r .release "$MANIFEST"), not $RELEASE"
            exit 1
          fi
          echo "version=$(jq -r .version "$MANIFEST")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .sha "$MANIFEST")" >> "$GITHUB_OUTPUT"
          echo "release_id=$(jq -r .release_id "$MANIFEST")" >> "$GITHUB_OUTPUT"

      - name: Download the logs of the run, the release assets and the cache keys
        env:
          RELEASE_ID: ${{ steps.manifest.outputs.release_id }}
        run: |
          AUDIT="$RUNNER_TEMP/audit"
          mkdir -p "$AUDIT/logs" "$AUDIT/assets"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > "$AUDIT/logs/run.log"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[] | "\(.id)\t\(.name)"' > "$AUDIT/assets.tsv"
          while IFS=$'\t' read -r ASSET_ID NAME; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$AUDIT/assets/$NAME"
          done < "$AUDIT/assets.tsv"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches" --jq '.actions_caches[].key' > "$AUDIT/cache-keys.txt"

      - name: Search for the seed of the run
        env:
          OPENPLC_TRUST_SEED_SECRET: ${{ secrets.TRUST_SEED_SECRET }}
          VERSION: ${{ steps.manifest.outputs.version }}
          SHA: ${{ steps.manifest.outputs.sha }}
        run: node tooling/scripts/release/seed-audit.mjs --version "$VERSION" --commit "$SHA" "$RUNNER_TEMP/audit"
