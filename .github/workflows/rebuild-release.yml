name: Rebuild Release

run-name: Rebuild ${{ inputs.release }} (${{ inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'rebuild: build and replace the six installers; dry-run: build only; verify: check the digests of a rebuild run; seed-audit: search a rebuild run for its seed'
        type: choice
        default: rebuild
        options:
          - rebuild
          - dry-run
          - verify
          - seed-audit
      ref:
        description: 'Branch to build (rebuild, dry-run)'
        type: string
        required: false
        default: ''
      release:
        description: 'Target release tag, e.g. v4.3.5 or v4.3.5-rehearsal (every mode)'
        type: string
        required: true
      negative_controls:
        description: 'Also run the negative controls (rehearsal only)'
        type: boolean
        default: false
      run_id:
        description: 'Rebuild run to verify or audit (verify, seed-audit)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: rebuild-${{ inputs.release }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22.x'
  DIGEST_JS: |
    const { createHash } = require('node:crypto')
    const { readFileSync, writeFileSync } = require('node:fs')
    const { basename } = require('node:path')
    const [out, ...files] = process.argv.slice(1)
    const digests = {}
    for (const file of files) digests[basename(file)] = createHash('sha256').update(readFileSync(file)).digest('hex')
    writeFileSync(out, JSON.stringify(digests, null, 2) + '\n')
    console.log(JSON.stringify(digests, null, 2))

jobs:
  resolve:
    if: ${{ inputs.mode == 'rebuild' || inputs.mode == 'dry-run' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Require a branch to build
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            echo "::error::The ref input is required in rebuild and dry-run modes"
            exit 1
          fi

      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Checkout the branch to build, with tags
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: tree
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve the commit
        id: sha
        run: echo "sha=$(git -C tree rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the app version against the release tag
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          VERSION=$(node tooling/scripts/release/check-version.mjs --release "$RELEASE" --tree tree)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require the commit to descend from the version tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          if ! git -C tree merge-base --is-ancestor "refs/tags/v$VERSION" "$SHA"; then
            echo "::error::Tag v$VERSION is not an ancestor of $SHA"
            exit 1
          fi

      - name: Find the release, drafts included
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          IDS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == $ENV.RELEASE) | .id')
          COUNT=$(printf '%s\n' "$IDS" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected one release with tag $RELEASE, found $COUNT"
            exit 1
          fi
          echo "release_id=$IDS" >> "$GITHUB_OUTPUT"

      - name: Record the original digests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          mkdir -p manifest
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.assets' > release-assets.json
          node tooling/scripts/release/release-digests.mjs before --version "$VERSION" --assets release-assets.json --out manifest/original.json
          jq -n --arg release "$RELEASE" --arg release_id "$RELEASE_ID" --arg version "$VERSION" --arg sha "$SHA" \
            '{release: $release, release_id: $release_id, version: $version, sha: $sha}' > manifest/manifest.json
          cat manifest/manifest.json manifest/original.json

      - name: Upload the rebuild manifest
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-manifest
          path: manifest/
          retention-days: 30
          if-no-files-found: error

  trust-module:
    needs: resolve
    runs-on: ubuntu-latest
    environment: release-trust
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Checkout the commit to build
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: tree
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: tree
        run: npm ci --ignore-scripts

      - name: Generate the trust module
        working-directory: tree
        env:
          OPENPLC_TRUST_SEED_SECRET: ${{ secrets.TRUST_SEED_SECRET }}
        run: npx ts-node --transpile-only scripts/package-trust/cli.ts generate-release --version "$VERSION" --commit "$SHA" --out release/package-trust/package-trust-anchor.ts

      - name: Check the trust module at every check site
        working-directory: tree
        run: |
          OPENPLC_TRUST_MODULE_UNDER_TEST="$GITHUB_WORKSPACE/tree/release/package-trust/package-trust-anchor.ts" \
            npx jest --config jest.config.json --ci src/backend/editor/package-trust/__tests__/check-sites.test.ts

      - name: Upload the trust module
        uses: actions/upload-artifact@v4
        with:
          name: trust-module
          path: tree/release/package-trust/package-trust-anchor.ts
          retention-days: 1
          if-no-files-found: error

  build-macos:
    needs: [resolve, trust-module]
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Checkout the commit to build
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: tree
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tree/package-lock.json

      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: tree/resources/bin
          key: binaries-macOS-${{ hashFiles('tree/binary-versions.json') }}

      - name: Install dependencies
        working-directory: tree
        run: npm ci

      - name: Download binaries for x64
        working-directory: tree
        run: npx ts-node scripts/download-binaries.ts --arch x64

      - name: Download the trust module
        uses: actions/download-artifact@v4
        with:
          name: trust-module
          path: tree/release/package-trust

      - name: Build date
        id: date
        run: echo "build_date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Import Code Signing Certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          rm $RUNNER_TEMP/certificate.p12

      - name: Build and package
        working-directory: tree
        env:
          CI: 'true'
          OPENPLC_RELEASE_BUILD: '1'
          BUILD_DATE: ${{ steps.date.outputs.build_date }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create branded DMG files
        working-directory: tree
        run: |
          chmod +x ./create_dmg.sh
          ./create_dmg.sh "$VERSION"

      - name: Collect the installers and their digests
        run: |
          mkdir -p out
          mv "tree/OpenPLC_Editor_${VERSION}.dmg" "out/OpenPLC_Editor_${VERSION}.dmg"
          mv "tree/OpenPLC_Editor_${VERSION}-ARM.dmg" "out/OpenPLC_Editor_${VERSION}-ARM.dmg"
          node -e "$DIGEST_JS" built-macos.json out/*

      - name: Read the fuses of every built executable
        run: node tooling/scripts/release/read-fuses.mjs "tree/release/build/mac/OpenPLC Editor.app" "tree/release/build/mac-arm64/OpenPLC Editor.app"

      - name: Scan the unpacked outputs for trust-anchor literals
        run: node tooling/scripts/release/scan-trust-literals.mjs --trusted-keys tooling/src/backend/shared/utils/vpp/trusted-keys.ts tree/release/build/mac tree/release/build/mac-arm64

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: out/
          retention-days: 7
          if-no-files-found: error

      - name: Upload the digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-macos
          path: built-macos.json
          retention-days: 30
          if-no-files-found: error

  build-windows-x64:
    needs: [resolve, trust-module]
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Checkout the commit to build
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: tree
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tree/package-lock.json

      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: tree/resources/bin
          key: binaries-Windows-x64-${{ hashFiles('tree/binary-versions.json') }}

      - name: Install dependencies
        working-directory: tree
        run: npm ci

      - name: Download binaries for x64
        working-directory: tree
        run: npx ts-node scripts/download-binaries.ts --arch x64

      - name: Download the trust module
        uses: actions/download-artifact@v4
        with:
          name: trust-module
          path: tree/release/package-trust

      - name: Build date
        id: date
        run: echo "build_date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and package
        working-directory: tree
        env:
          OPENPLC_RELEASE_BUILD: '1'
          BUILD_DATE: ${{ steps.date.outputs.build_date }}
        run: npm run package

      - name: Collect the installer and its digest
        run: |
          shopt -s nullglob
          INSTALLERS=(tree/release/build/*.exe)
          if [ "${#INSTALLERS[@]}" -ne 1 ]; then
            echo "::error::Expected one installer in release/build, found ${#INSTALLERS[@]}"
            exit 1
          fi
          mkdir -p out
          mv "${INSTALLERS[0]}" "out/OpenPLC.Editor_${VERSION}.exe"
          node -e "$DIGEST_JS" built-windows-x64.json out/*

      - name: Read the fuses of the built executable
        run: node tooling/scripts/release/read-fuses.mjs "tree/release/build/win-unpacked/OpenPLC Editor.exe"

      - name: Negative control, the original installer fails the fuse readout
        if: ${{ inputs.negative_controls }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "OpenPLC.Editor_${VERSION}.exe" --dir original
          7z x "original/OpenPLC.Editor_${VERSION}.exe" -o"original/nsis" -y > /dev/null
          7z x 'original/nsis/$PLUGINSDIR/app-64.7z' -o"original/app" -y > /dev/null
          BUILT="tree/release/build/win-unpacked/OpenPLC Editor.exe"
          ORIGINAL="original/app/OpenPLC Editor.exe"
          set +e
          node tooling/scripts/release/read-fuses.mjs "$BUILT" "$ORIGINAL" > readout.txt 2>&1
          STATUS=$?
          set -e
          cat readout.txt
          if [ "$STATUS" -ne 1 ]; then
            echo "::error::The fuse readout did not fail on the original v$VERSION executable"
            exit 1
          fi
          if ! grep -qF "$ORIGINAL" readout.txt; then
            echo "::error::The fuse readout did not name the original v$VERSION executable"
            exit 1
          fi
          if grep -qF "$BUILT" readout.txt; then
            echo "::error::The fuse readout named the rebuilt executable"
            exit 1
          fi

      - name: Scan the unpacked output for trust-anchor literals
        run: node tooling/scripts/release/scan-trust-literals.mjs --trusted-keys tooling/src/backend/shared/utils/vpp/trusted-keys.ts tree/release/build/win-unpacked

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows-x64
          path: out/
          retention-days: 7
          if-no-files-found: error

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-windows-x64
          path: built-windows-x64.json
          retention-days: 30
          if-no-files-found: error

  build-windows-arm64:
    needs: [resolve, trust-module]
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Checkout the commit to build
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: tree
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tree/package-lock.json

      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: tree/resources/bin
          key: binaries-Windows-arm64-${{ hashFiles('tree/binary-versions.json') }}

      - name: Install dependencies
        working-directory: tree
        run: npm ci

      - name: Download binaries for ARM64
        working-directory: tree
        run: npx ts-node scripts/download-binaries.ts --arch arm64

      - name: Download the trust module
        uses: actions/download-artifact@v4
        with:
          name: trust-module
          path: tree/release/package-trust

      - name: Build date
        id: date
        run: echo "build_date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build application
        working-directory: tree
        env:
          OPENPLC_RELEASE_BUILD: '1'
          BUILD_DATE: ${{ steps.date.outputs.build_date }}
        run: npm run build

      - name: Package for ARM64
        working-directory: tree
        env:
          CI: 'true'
          OPENPLC_RELEASE_BUILD: '1'
        run: npx electron-builder --win --arm64 --publish never

      - name: Collect the installer and its digest
        run: |
          shopt -s nullglob
          INSTALLERS=(tree/release/build/*.exe)
          if [ "${#INSTALLERS[@]}" -ne 1 ]; then
            echo "::error::Expected one installer in release/build, found ${#INSTALLERS[@]}"
            exit 1
          fi
          mkdir -p out
          mv "${INSTALLERS[0]}" "out/OpenPLC.Editor_${VERSION}-ARM64.exe"
          node -e "$DIGEST_JS" built-windows-arm64.json out/*

      - name: Read the fuses of the built executable
        run: node tooling/scripts/release/read-fuses.mjs "tree/release/build/win-arm64-unpacked/OpenPLC Editor.exe"

      - name: Scan the unpacked output for trust-anchor literals
        run: node tooling/scripts/release/scan-trust-literals.mjs --trusted-keys tooling/src/backend/shared/utils/vpp/trusted-keys.ts tree/release/build/win-arm64-unpacked

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows-arm64
          path: out/
          retention-days: 7
          if-no-files-found: error

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-windows-arm64
          path: built-windows-arm64.json
          retention-days: 30
          if-no-files-found: error

  build-linux-x64:
    needs: [resolve, trust-module]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Checkout the commit to build
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: tree
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tree/package-lock.json

      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: tree/resources/bin
          key: binaries-Linux-x64-${{ hashFiles('tree/binary-versions.json') }}

      - name: Install dependencies
        working-directory: tree
        run: npm ci

      - name: Download the trust module
        uses: actions/download-artifact@v4
        with:
          name: trust-module
          path: tree/release/package-trust

      - name: Build date
        id: date
        run: echo "build_date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and package
        working-directory: tree
        env:
          OPENPLC_RELEASE_BUILD: '1'
          BUILD_DATE: ${{ steps.date.outputs.build_date }}
        run: npm run package

      - name: Collect the installer and its digest
        run: |
          shopt -s nullglob
          INSTALLERS=(tree/release/build/*.AppImage)
          if [ "${#INSTALLERS[@]}" -ne 1 ]; then
            echo "::error::Expected one AppImage in release/build, found ${#INSTALLERS[@]}"
            exit 1
          fi
          mkdir -p out
          mv "${INSTALLERS[0]}" "out/OpenPLC.Editor-${VERSION}.AppImage"
          node -e "$DIGEST_JS" built-linux-x64.json out/*

      - name: Read the fuses of the built executable
        run: node tooling/scripts/release/read-fuses.mjs tree/release/build/linux-unpacked/open-plc-editor

      - name: Scan the unpacked output for trust-anchor literals
        run: node tooling/scripts/release/scan-trust-literals.mjs --trusted-keys tooling/src/backend/shared/utils/vpp/trusted-keys.ts tree/release/build/linux-unpacked

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: installers-linux-x64
          path: out/
          retention-days: 7
          if-no-files-found: error

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-x64
          path: built-linux-x64.json
          retention-days: 30
          if-no-files-found: error

  build-linux-arm64:
    needs: [resolve, trust-module]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Checkout the commit to build
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: tree
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tree/package-lock.json

      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: tree/resources/bin
          key: binaries-Linux-arm64-${{ hashFiles('tree/binary-versions.json') }}

      - name: Install dependencies
        working-directory: tree
        run: npm ci

      - name: Download the trust module
        uses: actions/download-artifact@v4
        with:
