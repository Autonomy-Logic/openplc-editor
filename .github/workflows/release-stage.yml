name: Raise Release Stage

# A stable release is published to 1% of installed editors (DOPE-486). Once the
# canary machines have updated cleanly, run this to widen it: 10, then 50, then
# 100. Each run rewrites `stagingPercentage` in the release's latest-*.yml;
# editors re-read those files on every check, so nothing else is uploaded.
# See docs/auto-update.md for the rollout procedure.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to widen (e.g., v4.3.3)'
        required: true
      percentage:
        description: 'New stage, an integer from 1 to 100 (100 offers it to everyone)'
        required: true

permissions:
  contents: read

jobs:
  raise-stage:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install the release verifier's dependency
        run: npm install --prefix "$RUNNER_TEMP/verifier" --no-audit --no-fund yaml@2.8.1

      - name: Download the release's update metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'latest*.yml' --dir stage

      - name: Set the stage
        env:
          NODE_PATH: ${{ runner.temp }}/verifier/node_modules
          PERCENTAGE: ${{ inputs.percentage }}
        run: node scripts/verify-release-assets.js stage stage --staging "$PERCENTAGE"

      - name: Upload the updated metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber stage/latest-*.yml
