name: CI - Migration (src2)

on:
  pull_request:
    branches:
      - main
      - development
      - refactor/shared-ui-migration

jobs:
  architecture:
    name: Architecture Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate architecture layers
        run: npx tsx src/__architecture__/validate.ts

  unit-tests:
    name: Unit Tests + Coverage (src2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        run: npx jest --config jest.config.json --collectCoverage --ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-src2
          path: coverage/src2/
          retention-days: 7
