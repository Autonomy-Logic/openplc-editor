name: CI

on:
  pull_request:
    branches:
      - main
      - development

jobs:
  # Decides whether build-check, lint and unit-tests, which MisterFlow already
  # ran locally on the demand head, may skip their steps. Only the run of the
  # opened event of a pull request into development that carries the
  # ci-passed-locally label skips them; every later run (synchronize,
  # reopened) and every pull request into main runs everything. The labels are
  # read from the API because the event payload can predate the label.
  local-ci-gate:
    name: Local CI label check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Read the ci-passed-locally label
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL: ci-passed-locally
        run: |
          skip=false
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$BASE_REF" != "development" ] || [ "$ACTION" != "opened" ]; then
            reason="Not the opened run of a pull request into development"
          else
            # gh pr create adds the label right after the pull request exists,
            # so poll for up to 10 seconds (at 0, 5 and 10 seconds).
            reason="Label $LABEL not found (or the labels could not be read) within 10 seconds"
            for i in 1 2 3; do
              if labels=$(timeout 15 gh api "repos/$REPO/issues/$PR_NUMBER/labels?per_page=100" --jq '.[].name'); then
                if printf '%s\n' "$labels" | grep -Fxq "$LABEL"; then
                  skip=true
                  break
                fi
              else
                echo "::warning::Could not read the pull request labels (attempt $i)."
              fi
              if [ "$i" -lt 3 ]; then sleep 5; fi
            done
          fi
          if [ "$skip" = "true" ]; then
            msg="Label $LABEL found on the opened run: build-check, lint and unit-tests skip their steps (they ran locally)."
          else
            msg="$reason: every job runs."
          fi
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  architecture:
    uses: ./.github/workflows/ci-architecture.yml

  # The skip is passed into the called workflow instead of being an `if:`
  # here: a skipped caller job never reports the called job's check name
  # (e.g. `lint / Lint Check`), so a required check would stay "Expected".
  # `!cancelled()` keeps these running in full if the label check fails.
  build-check:
    needs: [local-ci-gate]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/ci-build.yml
    with:
      skip: ${{ needs.local-ci-gate.outputs.skip == 'true' }}

  lint:
    needs: [local-ci-gate]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/ci-lint.yml
    with:
      skip: ${{ needs.local-ci-gate.outputs.skip == 'true' }}

  unit-tests:
    needs: [local-ci-gate]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/ci-unit-tests.yml
    with:
      skip: ${{ needs.local-ci-gate.outputs.skip == 'true' }}

  debug-lock-e2e:
    uses: ./.github/workflows/ci-e2e-debug-lock.yml

  # The explicit conditions below keep the usual rule (run only when the
  # direct needs succeeded) but ignore the label check further upstream:
  # without them a failed label check would skip format, sync and
  # complete-build through the implicit success(), which looks at every
  # upstream job, and the required checks would never report.
  format:
    needs: [architecture, build-check, lint]
    if: ${{ !cancelled() && needs.architecture.result == 'success' && needs.build-check.result == 'success' && needs.lint.result == 'success' }}
    uses: ./.github/workflows/ci-format.yml

  sync:
    needs: [format]
    if: ${{ !cancelled() && needs.format.result == 'success' }}
    uses: ./.github/workflows/ci-sync.yml
    secrets: inherit

  complete-build:
    needs: [sync]
    # Full 3-OS packaging is release work: the tag-triggered release
    # workflow builds it for real, so PRs into development skip it and
    # only the promotion PRs into main still prove the app packages.
    if: ${{ !cancelled() && needs.sync.result == 'success' && github.base_ref == 'main' }}
    uses: ./.github/workflows/build.yml
